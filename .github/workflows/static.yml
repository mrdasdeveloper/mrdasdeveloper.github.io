# Deploy static GitHub Pages site (HTML + assets at repo root only).
# Excludes admin/, winsta-ai-backend/, etc., so the artifact stays small and public-facing.
name: Deploy static content to Pages

on:
  push:
    branches: [main, master]
    paths:
      - "*.html"
      - "*.xml"
      - "robots.txt"
      - "*.ico"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.webp"
      - "*.pdf"
      - "*.css"
      - "*.js"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build artifact and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble site (root public files only)
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s nullglob
          for f in *.html *.xml robots.txt *.ico *.png *.jpg *.jpeg *.webp *.pdf *.css *.js; do
            if [[ -f "$f" ]]; then
              cp -p "$f" _site/
            fi
          done
          if [[ ! -f _site/index.html ]]; then
            echo "::error::_site/index.html is required for Pages"
            exit 1
          fi
          echo "Files to deploy:"
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
